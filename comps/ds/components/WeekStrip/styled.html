<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script>(function(){try{var q=new URLSearchParams(location.search),d=document.documentElement;d.dataset.theme=q.get('theme')==='dark'?'dark':'light';var p=q.get('palette');if(p&&/^[a-z]+$/.test(p))d.dataset.palette=p;}catch(e){}})();</script>
<title>WeekStrip — preview</title>

html,body{margin:0}
body{padding:24px;min-height:100vh;box-sizing:border-box}

</head>
<body class="lfc lfc-field">

</body>
</html>
