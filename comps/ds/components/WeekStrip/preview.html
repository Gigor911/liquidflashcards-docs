<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WeekStrip — preview</title>
<style>
html,body{margin:0}
body{padding:24px;min-height:100vh;box-sizing:border-box}

</style>
</head>
<body class="lfc lfc-field">
<div class="lfc-glass lfc-week" style="max-width:350px"><div class="day met"><span class="letter">M</span><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12.5l3 3 7-7"/></svg></span></div><div class="day met"><span class="letter">T</span><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12.5l3 3 7-7"/></svg></span></div><div class="day studied"><span class="letter">W</span><span class="mark"></span></div><div class="day met"><span class="letter">T</span><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12.5l3 3 7-7"/></svg></span></div><div class="day met"><span class="letter">F</span><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12.5l3 3 7-7"/></svg></span></div><div class="day today"><span class="letter">S</span><span class="mark"></span></div><div class="day future"><span class="letter">S</span><span class="mark"></span></div></div>
</body>
</html>
